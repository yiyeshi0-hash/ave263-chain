name: Build IPA

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Show Xcode
        run: xcodebuild -version

      - name: Install tools
        run: brew install ldid xcodegen || true

      - name: Generate project (auto-include all sources)
        run: |
          cd IPA
          xcodegen generate
          ls -la AVE263.xcodeproj

      - name: Build unsigned app
        run: |
          cd IPA
          set -o pipefail
          xcodebuild -project AVE263.xcodeproj \
            -scheme AVE263 \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            build 2>&1 | tee build.log | tail -30

      - name: Ldid-sign with entitlements and package IPA
        if: always()
        run: |
          cd IPA
          APP=$(find build -name 'AVE263.app' -type d | head -1)
          if [ -n "$APP" ]; then
            ldid -Sentitlements.plist "$APP/AVE263"
            rm -f "$APP/embedded.mobileprovision"
            ldid -e "$APP/AVE263" > entitlements-check.txt 2>&1 || true
            cat entitlements-check.txt || true
            rm -rf Payload
            mkdir -p Payload
            cp -R "$APP" Payload/
            zip -r AVE263-unsigned.ipa Payload
            ls -la AVE263-unsigned.ipa
          else
            echo "NO APP FOUND — build failed"
            tail -60 build.log
            exit 1
          fi

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: IPA/build.log

      - name: Upload IPA
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: AVE263-unsigned-ipa
          path: IPA/AVE263-unsigned.ipa
